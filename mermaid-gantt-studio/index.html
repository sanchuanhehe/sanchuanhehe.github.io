<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mermaid 排期编辑器</title><meta name="description" content="本地编辑 Mermaid，实时预览甘特图，导出 SVG 和 PNG。"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="topbar"><div class="brand"><span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i></span><h1>Mermaid <span>排期工作台</span></h1><span class="brand-local">在线</span></div><div class="actions"><button id="open-settings" aria-haspopup="dialog">画布设置</button><label class="button" for="file">打开 .mmd</label><input id="file" type="file" accept=".mmd,.mermaid,.txt,.md" hidden><button id="save-source">保存源码</button><span class="divider"></span><button id="svg" disabled>导出 SVG</button><button id="png" class="primary" disabled>导出 PNG</button></div></header>
<div class="workspace-bar"><div class="view-switch" role="group" aria-label="工作区视图"><button data-view="split" aria-pressed="true">源码与预览</button><button data-view="preview" aria-pressed="false">专注预览</button><button data-view="source" aria-pressed="false">专注源码</button></div><span class="workspace-tip">点击图中任务，直接调整名称、日期与状态</span></div><main>

<section class="workspace">
<section class="editor-pane" aria-label="Mermaid 编辑区"><div class="pane-head"><h2><span class="pane-number">01</span>Mermaid 源码</h2><button id="sample" class="text-button">载入示例</button></div><div class="editor-wrap"><pre id="lines" aria-hidden="true">1</pre><textarea id="source" aria-label="Mermaid 源码" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" placeholder="输入 gantt 或粘贴 Mermaid 源码…"></textarea></div><div class="editor-foot"><span id="line-count">0 行</span><span>自动预览 · ⌘ / Ctrl + Enter 渲染</span></div></section>
<section class="preview-pane" aria-label="预览区"><div class="pane-head"><h2><span class="pane-number">02</span>图表预览 <span id="size"></span></h2><div class="preview-actions"><button id="undo-visual" class="text-button" disabled>撤销图上修改</button><button id="refresh" class="text-button" title="重新生成预览">重新渲染</button><button id="zoom-out" class="zoom-step" aria-label="缩小预览">−</button><label class="zoom-label">缩放<select id="zoom"><option value="fit">适应宽度</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option><option value="1.5">150%</option></select></label><button id="zoom-in" class="zoom-step" aria-label="放大预览">＋</button></div></div><div id="notice" role="status" aria-live="polite">正在载入示例…</div><div id="viewport"><div id="paper"><img id="preview" alt="Mermaid 图表预览" hidden><div id="task-overlay"></div><div id="empty"><strong>让计划变得清晰</strong><br>在左侧输入 Mermaid，预览会自动生成。</div></div></div><div class="preview-foot"><span id="summary">Mermaid 11.17.2</span><label class="wheel-control"><input type="checkbox" id="wheel-zoom">滚轮直接缩放</label><span>捏合或 Ctrl / ⌘ + 滚轮缩放</span></div></section>
</section>
</main>
<dialog id="settings-dialog" aria-labelledby="settings-heading"><div class="dialog-head"><div><h2 id="settings-heading">画布设置</h2><p class="dialog-subtitle">调整输出尺寸与图表样式</p></div><button id="close-settings" aria-label="关闭画布设置">×</button></div><aside class="settings" aria-label="画布设置">
<label>样式<select id="mode"><option value="styled">泳道增强</option><option value="native">官方原样</option></select></label>
<label>画布宽度 <span>px</span><input id="width" type="number" min="720" max="7680" step="80" value="2560"></label>
<label>画布比例<select id="aspect"><option value="">自动高度</option><option value="16:9">16 : 9</option><option value="4:3">4 : 3</option><option value="1:1">1 : 1</option></select></label>
<label>字号 <span>px</span><input id="font" type="number" min="10" max="48" value="23"></label>
<label>行高 <span>px</span><input id="row" type="number" min="14" max="100" value="27"></label>
<label>发布日期线<input id="release" type="date" value="2026-10-15"></label>
<label class="check"><input id="dates" type="checkbox" checked>显示任务日期</label>
<label class="check"><input id="today" type="checkbox">显示今天</label>
<details><summary>备注与导出</summary><label>备注标签<input id="note-label" value="备注" maxlength="12"></label><label>备注内容<textarea id="note" rows="3">确认负责人及跨团队依赖</textarea></label><label>PNG 像素倍率<select id="scale"><option value="1">1×</option><option value="2">2×</option><option value="3">3×</option></select></label></details>
<p class="hint">比例可自由调整；任务多时，选择自动高度。</p>
</aside><div class="dialog-actions"><button id="settings-done" class="primary">完成</button></div></dialog>
<iframe id="engine" src="renderer.html" sandbox="allow-scripts allow-same-origin" title="图表渲染" aria-hidden="true" tabindex="-1"></iframe>
<dialog id="task-dialog" aria-labelledby="task-heading"><form id="task-form"><div class="dialog-head"><h2 id="task-heading">编辑任务</h2><button type="button" id="task-close" aria-label="关闭">×</button></div><p id="task-id" class="hint"></p><label>任务名称<input id="task-name" required></label><label>开始 / 依赖<input id="task-start" placeholder="2026-09-10 或 after p1" required></label><label>结束 / 工期<input id="task-end" placeholder="2026-09-17 或 7d；单字段排期可留空"></label><p class="hint">直接修改日期或工期。依赖表达式会原样保留，由 Mermaid 重新排期。</p><div class="task-flags"><label><input type="checkbox" id="task-done">已完成</label><label><input type="checkbox" id="task-active">进行中</label><label><input type="checkbox" id="task-crit">风险</label><label><input type="checkbox" id="task-milestone">里程碑</label></div><p id="task-error" role="alert"></p><div class="dialog-actions"><button type="button" id="task-cancel">取消</button><button class="primary" type="submit">应用到源码</button></div></form></dialog>
<script type="module" src="app.mjs"></script>
</body></html>
